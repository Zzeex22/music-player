<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h2>PLAYER</h2>
            </div>
            <ul class="menu-list">
                <li class="menu-item active"><img src="icons/home.png" width="20" alt="Home"> Beranda</li>
            </ul>
        </aside>

        <main class="main-content">
            <h1 id="main-title">Daftar Putar</h1>
            
            <div class="album-grid" id="songs-grid-container">
                </div>

            <div class="lyrics-container" id="lyrics-container">
                <p id="lyrics-text">Pilih lagu untuk melihat lirik...</p>
            </div>
        </main>

        <footer class="bottom-player">
            <div class="now-playing">
                <div class="current-cover-box" id="current-cover"></div>
                <div class="song-details">
                    <h4 id="current-title">Judul Lagu</h4>
                    <p id="current-artist">Nama Artis</p>
                </div>
            </div>
            
            <div class="player-controls">
                <div class="control-buttons">
                    <button class="ctrl-btn" id="prev-btn">
                        <img src="icons/prev.png" width="24" alt="Prev">
                    </button>
                    <div class="play-pause-container" id="play-btn-container">
                        <img id="play-icon" src="icons/play.png" width="20" alt="Play">
                    </div>
                    <button class="ctrl-btn" id="next-btn">
                        <img src="icons/next.png" width="24" alt="Next">
                    </button>
                </div>
                
                <div class="progress-container">
                    <span class="time-stamp" id="current-time">0:00</span>
                    <div class="progress-bar-wrapper" id="progress-wrapper">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <span class="time-stamp" id="total-duration">0:00</span>
                </div>
            </div>
            
            <div class="volume-controls">
                <button class="ctrl-btn" id="lyrics-toggle-btn" style="margin-right: 15px;" title="Tampilkan Lirik">
                    <img src="icons/lyrics.png" width="20" alt="Lyrics">
                </button>
                <img src="icons/volume.png" width="20" alt="Volume">
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
            </div>
        </footer>
    </div>

    <audio id="audio-engine"></audio>

<script src="script.js"></script>
</body>
</html>
